<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Письмо под лупой</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div class="brand">ЗАВОД<span>практика внимания</span></div><div class="title"><h1>Письмо под лупой</h1><p>Изучайте фрагменты. Объясняйте свои выводы.</p></div><button id="conditions" class="outline" hidden>Условия</button></header>
<main><div class="laptop"><img class="laptop-image" src="assets/laptop.webp" alt="Нарисованный ноутбук"><article class="screen" aria-label="Рабочая почта"><div class="mailbar"><span class="mail-icon" aria-hidden="true">✉</span><span>Рабочая почта</span><span class="inbox">Входящие / 1 письмо</span></div><div id="notification"><span class="notification-icon" aria-hidden="true">✉</span><h2>Вам пришло письмо</h2><button class="primary" id="open-mail">Открыть письмо</button></div><div class="letter" hidden><div class="sender interactive" role="button" tabindex="0" data-fragment="sender"><span class="avatar" aria-hidden="true">С</span><div><strong id="sender-name"></strong><span id="sender-address"></span></div></div><p class="recipient" id="recipient"></p><h2 class="subject interactive" role="button" tabindex="0" data-fragment="subject"></h2><div id="blocks"></div></div><footer class="mailfooter" hidden><span>Выбирайте фрагменты для разбора</span><button class="primary" id="finish">Завершить разбор</button><button class="primary" id="back-summary" hidden>К итогу</button></footer></article></div></main>
<footer class="caption"><span>Внимание к деталям — спокойное решение.</span></footer><div id="announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<dialog id="modal" aria-labelledby="dialog-title"><div class="dialog-heading"><span class="eyebrow">ПИСЬМО ПОД ЛУПОЙ</span><button class="close" aria-label="Закрыть">×</button></div><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions" id="dialog-actions"></div></dialog>
<script src="exercise-data.js"></script><script src="app.js"></script></body></html>
